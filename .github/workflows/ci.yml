name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version

      - name: Unit tests
        run: swift test --parallel

      - name: Build universal app
        run: scripts/build-app.sh universal

      - name: Verify bundle
        run: |
          codesign --verify --strict build/Dialed.app
          plutil -lint build/Dialed.app/Contents/Info.plist
          lipo -archs build/Dialed.app/Contents/MacOS/Dialed
          test -f build/Dialed.app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" build/Dialed.app/Contents/Info.plist | grep -q true

      - name: Build DMG
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgenv"
          "$RUNNER_TEMP/dmgenv/bin/pip" install --quiet dmgbuild
          DMGBUILD="$RUNNER_TEMP/dmgenv/bin/dmgbuild" scripts/build-dmg.sh

      - name: Verify DMG
        run: |
          hdiutil attach -nobrowse -readonly build/Dialed.dmg -mountpoint /tmp/dialed-dmg
          test -d /tmp/dialed-dmg/Dialed.app
          test -L /tmp/dialed-dmg/Applications
          test -f /tmp/dialed-dmg/.DS_Store
          codesign --verify --strict /tmp/dialed-dmg/Dialed.app
          hdiutil detach /tmp/dialed-dmg

      - name: Upload app
        uses: actions/upload-artifact@v5
        with:
          name: Dialed-app
          path: |
            build/Dialed.dmg
            build/Dialed.zip
          if-no-files-found: error

      - name: Sign update and write appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_VERSION: "2.10.0"
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is missing; releases must ship a signed update feed."
            exit 1
          fi
          KEY_IN_APP="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' build/Dialed.app/Contents/Info.plist)"
          if [[ -z "$KEY_IN_APP" || "$KEY_IN_APP" == __* ]]; then
            echo "::error::Resources/SparklePublicKey.txt is missing; the app couldn't verify updates."
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          SIGNATURE="$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$RUNNER_TEMP/sparkle.key" build/Dialed.dmg)"
          rm -f "$RUNNER_TEMP/sparkle.key"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Dialed.app/Contents/Info.plist)"
          python3 scripts/make-appcast.py --version "$(cat VERSION)" --build "$BUILD" \
            --tag "$GITHUB_REF_NAME" --signature "$SIGNATURE"
          xmllint --noout build/appcast.xml

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" build/Dialed.dmg build/Dialed.zip build/appcast.xml \
            --title "Dialed ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE_NOTES.md "${PRERELEASE[@]}"
