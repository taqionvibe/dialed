name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version

      - name: Unit tests
        run: swift test --parallel

      - name: Build universal app
        run: scripts/build-app.sh universal

      - name: Verify bundle
        run: |
          codesign --verify --strict build/Dialed.app
          plutil -lint build/Dialed.app/Contents/Info.plist
          lipo -archs build/Dialed.app/Contents/MacOS/Dialed
          test -f build/Dialed.app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" build/Dialed.app/Contents/Info.plist | grep -q true

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Dialed-app
          path: build/Dialed.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Dialed.zip \
            --title "Dialed ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE_NOTES.md
